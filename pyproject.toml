[project]
name = "hubspot-wefact"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.2.0",
  "dotenv>=0.9.9",
  "hubspot-api-client==12.0.0",
  "pip>=25.3",
  "pydantic>=2.10.6",
  "python-dotenv>=1.2.1",
  "requests>=2.32.5",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.0", "fastapi>=0.115"]

[tool.pytest.ini_options]
pythonpath = ["src", "service"]
testpaths = ["tests"]
